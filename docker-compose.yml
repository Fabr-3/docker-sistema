
name: visual-com

services:
  base-datos:
    image: postgres:18.6-alpine
    container_name: visual-com-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-proyecto-visual-com}
      POSTGRES_USER: ${DB_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${DB_CONTRASENA:-postgres}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      # puerto 5433 para no chocar con 5432 de PostgreSQL
      - "127.0.0.1:${DB_PUERTO:-5433}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./database/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
